name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medcore
          POSTGRES_USER: medcore
          POSTGRES_PASSWORD: medcore-ci-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U medcore -d medcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://medcore:medcore-ci-password@localhost:5433/medcore?schema=public
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: ci-only-test-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/backend/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/backend/prisma/schema.prisma
      - run: npm run db:seed --workspace=@medcore/backend
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
