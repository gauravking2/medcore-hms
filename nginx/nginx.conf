events {}
http {
  upstream frontend { server frontend:3000; }
  upstream backend { server backend:3001; }
  server {
    listen 80;
    server_name _;
    # TLS certificates and HTTPS policy are deployment-specific; configure before production use.
    location /api/ { proxy_pass http://backend/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /health { proxy_pass http://backend/health; }
    location / { proxy_pass http://frontend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  }
}
